plugins { id 'com.android.application' }
android {
    namespace 'sbs.astrogate.manager'
    compileSdk 35
    defaultConfig { applicationId 'sbs.astrogate.manager'; minSdk 29; targetSdk 35; versionCode 2; versionName '0.1.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    packaging { resources { excludes += ['META-INF/versions/**/OSGI-INF/MANIFEST.MF'] } }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'com.github.mwiede:jsch:0.2.26'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'commons-net:commons-net:3.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
