name: Build signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify file services
        run: bash scripts/test-file-services.sh
      - name: Build and sign
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/build-signed-ipa.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: AstroGate-0.4.15-adhoc
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 3
